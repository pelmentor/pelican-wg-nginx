# =============================================================================
# Nginx config for Pelican Egg
# =============================================================================
# Lives in /home/container/nginx/ — editable via Pelican File Manager.
# Placeholders ({{...}}) are substituted by entrypoint.sh on each start.
#
# All paths point to /home/container/ (persistent Pelican volume).
# System dirs (/run, /var/log, /tmp) are NOT used — they are either
# read-only or ephemeral in Pelican containers.
# =============================================================================

# No "user" directive — Pelican runs as UID 1000, nginx is already non-root.
worker_processes auto;
daemon off;

# Logs — persistent, visible in Pelican File Manager
error_log /home/container/logs/nginx-error.log warn;

# PID file — in persistent volume, not /run (read-only in Pelican)
pid {{NGINX_PID_FILE}};

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp dirs — in persistent volume, not /tmp (ephemeral) or /var/cache (read-only).
    # Nginx needs these for buffering request bodies and proxied responses.
    client_body_temp_path {{NGINX_TEMP}}/client_temp;
    proxy_temp_path {{NGINX_TEMP}}/proxy_temp;
    fastcgi_temp_path {{NGINX_TEMP}}/fastcgi_temp;
    uwsgi_temp_path {{NGINX_TEMP}}/uwsgi_temp;
    scgi_temp_path {{NGINX_TEMP}}/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /home/container/logs/nginx-access.log main;

    # Static file optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Max upload size — for data delivery via HTTP POST/PUT
    client_max_body_size 100m;

    server {
        listen {{SERVER_PORT}} default_server;
        server_name _;

        root /home/container/webroot;
        index index.html index.php;

        location / {
            try_files $uri $uri/ =404;
        }

        # PHP via FPM unix socket (faster than TCP for same-container)
        location ~ \.php$ {
            fastcgi_pass unix:{{PHP_FPM_SOCK}};
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_index index.php;
        }

        # Health check — validates full chain: nginx → socket → php-fpm
        # Ref: trafex/docker-php-nginx
        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            allow 127.0.0.1;
            deny all;
            fastcgi_pass unix:{{PHP_FPM_SOCK}};
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }

        # Nginx status — for monitoring
        location /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            stub_status;
        }

        # Block hidden files (.git, .env, etc.)
        location ~ /\. {
            deny all;
        }

        # Static asset caching
        location ~* \.(png|jpg|jpeg|gif|webp|ico|css|js|json|svg)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}
