# =============================================================================
# Nginx конфигурация для Pelican Egg
# =============================================================================
# Этот файл копируется в /home/container/nginx/ при сборке образа.
# Пользователь может редактировать его через Pelican File Manager.
#
# Плейсхолдеры {{SERVER_PORT}} и {{PHP_FPM_SOCK}} заменяются
# в entrypoint.sh при старте контейнера.
#
# ВАЖНО: daemon off — Nginx работает на переднем плане,
# чтобы entrypoint мог контролировать его жизненный цикл.
# =============================================================================

# No "user" directive — Pelican runs the container as UID 1000 (container),
# so nginx master is already non-root and would ignore the directive anyway.
worker_processes auto;
daemon off;

# Логи пишем в директорию контейнера, чтобы пользователь видел их в File Manager
# Logs in /home/container/logs/ — visible via Pelican File Manager
error_log /home/container/logs/nginx-error.log warn;
# PID in /tmp/ because /run is read-only in Pelican containers
pid /tmp/run-nginx/nginx.pid;

events {
    # 1024 достаточно для карты — она обычно обслуживает
    # десятки, максимум сотни одновременных подключений
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ref: trafex/docker-php-nginx — temp-директории в /tmp/ для non-root работы.
    # Без этого nginx не может записывать временные файлы при запуске от user container.
    # Ref: official nginx image оставляет дефолтный /var/cache/nginx/, но он требует root.
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # Формат логов с реальным IP (полезно для отладки через WG)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /home/container/logs/nginx-access.log main;

    # Оптимизации для раздачи статики (тайлы карты — много мелких файлов)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive — браузер загружает сотни тайлов при просмотре карты,
    # переиспользование соединений критично для производительности
    keepalive_timeout 65;

    # Gzip — тайлы карты (PNG/JSON) хорошо сжимаются
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Ограничение размера тела запроса — нужно если MC-сервер
    # пушит тайлы через HTTP POST/PUT
    client_max_body_size 100m;

    server {
        listen {{SERVER_PORT}} default_server;
        server_name _;

        root /home/container/webroot;
        index index.html index.php;

        # Основной location — сначала пробуем файл, потом директорию,
        # потом 404. Стандартная схема для статических сайтов.
        location / {
            try_files $uri $uri/ =404;
        }

        # PHP-обработка через FPM (unix socket — быстрее TCP)
        location ~ \.php$ {
            fastcgi_pass unix:{{PHP_FPM_SOCK}};
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
            fastcgi_index index.php;
        }

        # =================================================================
        # Health check endpoint — проверяет всю цепочку nginx → php-fpm.
        # Ref: trafex/docker-php-nginx — лучший паттерн health check:
        # curl http://127.0.0.1/fpm-ping возвращает "pong" если PHP-FPM жив.
        # Доступен ТОЛЬКО с localhost (deny all для внешних запросов).
        # =================================================================
        location ~ ^/(fpm-status|fpm-ping)$ {
            access_log off;
            allow 127.0.0.1;
            deny all;
            fastcgi_pass unix:{{PHP_FPM_SOCK}};
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include /etc/nginx/fastcgi_params;
        }

        # Ref: official nginx — stub_status для мониторинга самого nginx
        location /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny all;
            stub_status;
        }

        # Запрещаем доступ к скрытым файлам (.htaccess, .git и т.д.)
        location ~ /\. {
            deny all;
        }

        # Кэширование статики — тайлы карты меняются не часто,
        # клиент может кэшировать их на 1 час
        location ~* \.(png|jpg|jpeg|gif|webp|ico|css|js|json|svg)$ {
            expires 1h;
            add_header Cache-Control "public, immutable";
        }
    }
}
