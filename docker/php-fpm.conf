; =============================================================================
; PHP-FPM configuration for Pelican Egg
; PHP version: 8.1 (from Ubuntu 22.04 system packages)
; =============================================================================
; Minimal config — a Minecraft map rarely needs heavy PHP processing.
; PHP is used mainly for:
; - Dynmap (if its built-in PHP web server is enabled)
; - Custom tile upload/processing scripts
;
; Unix socket is chosen over TCP because:
; 1. Less overhead (no TCP handshake)
; 2. Nginx and PHP-FPM run on the same machine — TCP is unnecessary
; 3. More secure — the socket is only accessible locally
; =============================================================================

[global]
; Logs go to the container directory — visible via Pelican File Manager
error_log = /home/container/logs/php-fpm-error.log
; Do not daemonize — the entrypoint controls the process lifecycle
daemonize = no

[www]
; Run as the container user (UID 1000) — required by Pelican
user = container
group = container

; Unix socket for communication with Nginx.
; The {{PHP_FPM_SOCK}} placeholder is substituted by entrypoint.sh at startup
; (default path: /tmp/php/php-fpm.sock).
listen = {{PHP_FPM_SOCK}}
listen.owner = container
listen.group = container
listen.mode = 0660

; Process manager mode: ondemand — workers are spawned only on incoming requests.
; Why ondemand: Minecraft map PHP requests are infrequent (low traffic),
; so there is no need to keep idle workers in memory. This saves RAM.
pm = ondemand
; Why max_children=5: sufficient for typical web map traffic; map viewers
; rarely generate more than a handful of concurrent PHP requests.
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Ref: trafex/docker-php-nginx — fpm-ping for health checks.
; Nginx proxies /fpm-ping here; a "pong" response means PHP-FPM is alive.
; fpm-status provides detailed statistics (active processes, requests, etc.)
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Ref: official php-fpm image — worker output logging.
; catch_workers_output=yes captures worker stdout/stderr.
; decorate_workers_output=no removes the "child said into stderr" prefix (cleaner logs).
; Ref: PHP bug #73886 — access.log goes to stderr, not stdout (FPM closes stdout on start).
catch_workers_output = yes
decorate_workers_output = no

; Why memory_limit=128M: enough for tile processing and typical map-related
; PHP scripts without risking out-of-memory in a small container.
php_admin_value[memory_limit] = 128M
; Why upload sizes 100M: allows large file uploads via HTTP (e.g., map data,
; pre-rendered tile archives, or configuration bundles).
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M
; Temporary directory for uploads — inside the container home
php_admin_value[upload_tmp_dir] = /home/container/tmp
