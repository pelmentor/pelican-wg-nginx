; =============================================================================
; PHP-FPM конфигурация для Pelican Egg
; =============================================================================
; Минимальный конфиг — карта Minecraft редко нуждается в тяжёлом PHP.
; PHP используется в основном для:
; - Dynmap (если включён внутренний веб-сервер Dynmap на PHP)
; - Кастомные скрипты обработки загрузки тайлов
;
; Unix socket выбран вместо TCP потому что:
; 1. Меньше overhead (нет TCP handshake)
; 2. Nginx и PHP-FPM на одной машине — TCP не нужен
; 3. Безопаснее — сокет доступен только локально
; =============================================================================

[global]
; Логи в директорию контейнера — видны через Pelican File Manager
error_log = /home/container/logs/php-fpm-error.log
; Не уходим в фон — entrypoint контролирует жизненный цикл
daemonize = no

[www]
; Запуск от пользователя container (UID 1000) — как требует Pelican
user = container
group = container

; Unix socket для связи с Nginx
listen = {{PHP_FPM_SOCK}}
listen.owner = container
listen.group = container
listen.mode = 0660

; Режим ondemand — воркеры создаются только при запросе.
; Для карты Minecraft PHP-запросы редки, не нужно держать воркеров в памяти.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Ref: trafex/docker-php-nginx — fpm-ping для health check.
; Nginx проксирует /fpm-ping сюда, ответ "pong" означает что PHP-FPM жив.
; fpm-status даёт детальную статистику (active processes, requests, etc.)
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Ref: official php-fpm image — логирование воркеров.
; catch_workers_output=yes перехватывает stdout/stderr воркеров.
; decorate_workers_output=no убирает префикс "child said into stderr" (чище логи).
; Ref: PHP bug #73886 — access.log в stderr, не stdout (FPM закрывает stdout при старте).
catch_workers_output = yes
decorate_workers_output = no

; Lимиты — 128M достаточно для обработки тайлов
php_admin_value[memory_limit] = 128M
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M
; Временная директория для загрузок — внутри home контейнера
php_admin_value[upload_tmp_dir] = /home/container/tmp
